<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Exam Countdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #ffffff; --fg: #37352f; --muted: #787774;
  --tile: #2f3437; --tile-fg: #ffffff; --accent: #b5371f;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #191919; --fg: #e9e9e7; --muted: #9b9a97; --tile: #f1f1ef; --tile-fg: #191919; --accent: #ff7a5c; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  display: flex; align-items: center; justify-content: center; padding: 12px 16px;
}
.wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: center; }
.label b { color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tile {
  position: relative; min-width: 68px; padding: 6px 10px; border-radius: 8px;
  background: var(--tile); color: var(--tile-fg);
  font-size: 2.4rem; font-weight: 600; line-height: 1.15; text-align: center;
  font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.tile::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--bg); opacity: .35; }
.cap { font-size: 0.72rem; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.done { font-size: 1.3rem; font-weight: 600; text-align: center; }
@media (max-width: 380px) { .tile { min-width: 54px; font-size: 1.8rem; } .row { gap: 6px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="label" id="label"></div>
  <div class="row" id="row">
    <div class="unit"><div class="tile" id="d">--</div><div class="cap">Days</div></div>
    <div class="unit"><div class="tile" id="h">--</div><div class="cap">Hours</div></div>
    <div class="unit"><div class="tile" id="m">--</div><div class="cap">Minutes</div></div>
    <div class="unit"><div class="tile" id="s">--</div><div class="cap">Seconds</div></div>
  </div>
</div>
<script>
// Defaults: Feb 2027 bar exam, 8:00 AM Eastern. Override with ?date=2027-07-27T08:00:00-04:00&title=July%202027%20Bar%20Exam&sub=Jul%2027
const p = new URLSearchParams(location.search);
const target = new Date(p.get("date") || "2027-02-23T08:00:00-05:00").getTime();
const title = p.get("title") || "Feb 2027 Bar Exam";
const sub = p.get("sub") || "Feb 23";
const lab = document.getElementById("label");
lab.append("Countdown to the ");
const b = document.createElement("b"); b.textContent = title; lab.append(b, " · " + sub);
const el = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
function tick() {
  const diff = target - Date.now();
  if (diff <= 0) { el("row").outerHTML = '<div class="done">Exam day. You\'ve got this!</div>'; return; }
  const s = Math.floor(diff / 1000);
  el("d").textContent = Math.floor(s / 86400);
  el("h").textContent = pad(Math.floor(s % 86400 / 3600));
  el("m").textContent = pad(Math.floor(s % 3600 / 60));
  el("s").textContent = pad(s % 60);
  setTimeout(tick, 1000 - (Date.now() % 1000));
}
tick();
</script>
</body>
</html>
